<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · 页面不存在</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    if (!t) t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  :root {
    --bg: #0a0a0f; --text: #ececf4; --soft: #b4b4c6; --muted: #7d7d93;
    --accent: #5eead4; --accent-2: #60a5fa; --ink: #04211d;
    --line: rgba(255,255,255,.12);
  }
  [data-theme="light"] {
    --bg: #fbfbfd; --text: #12121a; --soft: #3d3d4e; --muted: #6b6b80;
    --accent: #0d9488; --accent-2: #2563eb; --ink: #ffffff;
    --line: rgba(10,10,20,.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; display: grid; place-items: center;
    background: var(--bg); color: var(--text); padding: 32px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased; text-align: center; overflow: hidden;
  }
  body::before {
    content: ""; position: fixed; top: -20vw; left: 50%; width: 60vw; height: 60vw;
    transform: translateX(-50%); border-radius: 50%; filter: blur(90px);
    background: radial-gradient(circle, rgba(94,234,212,.22), transparent 68%);
    pointer-events: none;
  }
  .wrap { position: relative; max-width: 460px; }
  .code {
    margin: 0; font-size: clamp(4.5rem, 16vw, 7rem); font-weight: 800;
    line-height: 1; letter-spacing: -.05em;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 { margin: 14px 0 10px; font-size: 1.35rem; font-weight: 650; letter-spacing: -.01em; }
  p.desc { margin: 0 0 30px; color: var(--muted); font-size: 15px; line-height: 1.8; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .actions a {
    display: inline-flex; align-items: center; height: 44px; padding: 0 22px;
    border-radius: 12px; font-size: 14.5px; font-weight: 600; text-decoration: none;
    transition: transform .18s cubic-bezier(.22,1,.36,1), box-shadow .25s;
  }
  .primary {
    color: var(--ink); background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 14px 34px -16px rgba(94,234,212,.8);
  }
  .ghost { color: var(--text); border: 1px solid var(--line); }
  .actions a:hover { transform: translateY(-2px); }
</style>
</head>
<body>
  <main class="wrap">
    <p class="code">404</p>
    <h1>这个页面走丢了</h1>
    <p class="desc">链接可能已经失效，或者地址输错了一个字符。</p>
    <div class="actions">
      <a class="primary" href="./">回到首页</a>
      <a class="ghost" href="./#work">看看作品</a>
    </div>
  </main>
</body>
</html>
