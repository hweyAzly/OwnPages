<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">

<title>个人主页</title>
<meta name="description" content="个人主页">
<meta name="author" content="">

<!-- 分享卡片（内容由 main.js 根据 content.js 填充） -->
<meta property="og:type" content="website">
<meta property="og:title" content="个人主页">
<meta property="og:description" content="个人主页">
<meta property="og:url" content="">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="canonical" href="">

<!-- 在样式加载前先定主题，避免刷新时闪白 -->
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    if (!t) {
      t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches)
        ? "light" : "dark";
    }
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>

<body>
<div class="glow" aria-hidden="true">
  <span class="glow-a"></span>
  <span class="glow-b"></span>
</div>

<!-- ============ 导航 ============ -->
<header class="nav" id="nav">
  <div class="nav-inner">
    <a class="brand" href="#top">
      <span class="brand-dot"></span>
      <span id="brandName">…</span>
    </a>

    <nav class="nav-menu" id="navMenu" aria-label="主导航">
      <a href="#about">关于</a>
      <a href="#work">作品</a>
      <a href="#path">经历</a>
      <a href="#contact">联系</a>
    </nav>

    <button class="theme-toggle" id="themeToggle" aria-label="切换明暗主题" title="切换主题">
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none"
           stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2.5v2.2M12 19.3v2.2M4.2 12H2M22 12h-2.2M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none"
           stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M20.5 14.6A8.6 8.6 0 1 1 9.4 3.5a6.9 6.9 0 0 0 11.1 11.1z"/>
      </svg>
    </button>
  </div>
</header>

<main>

  <!-- ============ 首屏 ============ -->
  <section class="hero" id="top">
    <div class="hero-inner">
      <div class="hero-avatar" id="heroAvatar" aria-hidden="true"></div>

      <p class="hero-hello reveal">你好，我是</p>
      <h1 class="hero-name reveal" id="heroName">…</h1>
      <p class="hero-role reveal" id="heroRole"></p>
      <p class="hero-typing reveal">
        <span id="typed"></span><span class="caret" aria-hidden="true"></span>
      </p>

      <div class="hero-actions reveal">
        <a class="btn btn-primary" href="#work">看看我的作品</a>
        <a class="btn btn-ghost" id="btnMail" href="#contact">联系我</a>
      </div>

      <div class="hero-socials reveal" id="heroSocials"></div>
      <p class="hero-location reveal" id="heroLocation"></p>
    </div>

    <a class="scroll-hint" href="#about" aria-label="向下滚动">
      <span></span>
    </a>
  </section>

  <!-- ============ 关于 ============ -->
  <section class="section" id="about">
    <div class="section-head reveal">
      <span class="section-index">01</span>
      <h2 class="section-title">关于</h2>
    </div>

    <div class="about-grid">
      <div class="about-text reveal" id="aboutText"></div>

      <aside class="about-side">
        <div class="stats reveal" id="stats"></div>
        <ul class="skills reveal" id="skills"></ul>
      </aside>
    </div>
  </section>

  <!-- ============ 作品 ============ -->
  <section class="section" id="work">
    <div class="section-head reveal">
      <span class="section-index">02</span>
      <h2 class="section-title">作品</h2>
    </div>
    <p class="section-sub reveal" id="workSub"></p>
    <div class="project-grid" id="projectGrid"></div>
  </section>

  <!-- ============ 经历 ============ -->
  <section class="section" id="path">
    <div class="section-head reveal">
      <span class="section-index">03</span>
      <h2 class="section-title">经历</h2>
    </div>
    <p class="section-sub reveal" id="pathSub"></p>
    <ol class="timeline" id="timeline"></ol>
  </section>

  <!-- ============ 联系 ============ -->
  <section class="section" id="contact">
    <div class="section-head reveal">
      <span class="section-index">04</span>
      <h2 class="section-title">联系</h2>
    </div>

    <div class="contact-card reveal">
      <p class="contact-text" id="contactText"></p>
      <a class="btn btn-primary btn-lg" id="contactBtn" href="#">发邮件</a>
      <div class="contact-socials" id="contactSocials"></div>
    </div>
  </section>

</main>

<!-- ============ 页脚 ============ -->
<footer class="footer">
  <div class="footer-inner">
    <p id="footerText"></p>
    <p class="footer-note">
      <span id="footerNote"></span>
      <span id="footerIcp"></span>
    </p>
  </div>
</footer>

<script src="assets/js/content.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
